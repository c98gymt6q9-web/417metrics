<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>417 Metrics - Система Тестирования</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {
            --primary-color: var(--primary-color);
            --dark-primary: var(--dark-primary);
            --bg-gradient-1: #B71C1C;
            --bg-gradient-2: #7B1313;
            --text-color: #333;
            --bg-color: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }

        body.dark-mode {
            --bg-gradient-1: #1a1a1a;
            --bg-gradient-2: #2d2d2d;
            --text-color: #e0e0e0;
            --bg-color: #2d2d2d;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body.blue-mode {
            --primary-color: #1976D2;
            --dark-primary: #0D47A1;
            --bg-gradient-1: #0D47A1;
            --bg-gradient-2: #1565C0;
            --text-color: #333;
            --bg-color: #ffffff;
        }

        body.blue-mode.dark {
            --text-color: #e0e0e0;
            --bg-color: #2d2d2d;
        }

        body.green-mode {
            --primary-color: #388E3C;
            --dark-primary: #1B5E20;
            --bg-gradient-1: #1B5E20;
            --bg-gradient-2: #2E7D32;
        }

        body.bw-mode {
            --primary-color: #000000;
            --dark-primary: #1a1a1a;
            --bg-gradient-1: #f5f5f5;
            --bg-gradient-2: #e0e0e0;
            --text-color: #000;
            --bg-color: #ffffff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-color);
            border-radius: 15px;
            box-shadow: 0 20px 60px var(--shadow-color);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .theme-selector {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 8px;
        }

        .theme-btn {
            padding: 8px 12px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            transition: all 0.2s;
        }

        .theme-btn.active {
            background: white;
            color: var(--primary-color);
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 20px;
        }

        .test-selector {
            margin-bottom: 30px;
        }

        .test-selector label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        .test-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .test-selector select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Settings Section */
        .settings-section {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .settings-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .settings-title::before {
            content: "⚙️";
            font-size: 1.2em;
        }

        .setting-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .setting-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .setting-desc {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 8px;
        }

        .select-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .select-option {
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            background: white;
            transition: all 0.3s;
            font-size: 0.95em;
        }

        .select-option:hover {
            border-color: var(--primary-color);
            background: #ffe6e6;
        }

        .select-option.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle {
            width: 50px;
            height: 28px;
            background: #ddd;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .toggle.active {
            background: var(--primary-color);
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 24px;
        }

        .question-selector {
            max-height: 300px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: white;
        }

        .question-item {
            padding: 10px;
            margin-bottom: 5px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-item:hover {
            background: #f5f5f5;
        }

        .question-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .question-item label {
            cursor: pointer;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .btn-start {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start:hover {
            box-shadow: 0 15px 30px rgba(211, 47, 47, 0.4);
        }

        .hidden {
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            color: #666;
            margin-bottom: 20px;
            font-size: 0.95em;
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
        }

        .progress-item {
            font-weight: 600;
            color: var(--primary-color);
        }

        .question-block {
            margin-bottom: 40px;
        }

        .question-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid var(--primary-color);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }


        .option:hover {
            border-color: var(--primary-color);
            background: #ffe6e6;
            box-shadow: 0 5px 15px rgba(211, 47, 47, 0.2);
        }

        .option.revealed-correct {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        .option.revealed-incorrect {
            border-color: #f44336;
            background: #fef1f0;
        }

        .correct-badge {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 10px;
            font-weight: 600;
        }

        .incorrect-badge {
            display: inline-block;
            background: #f44336;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
            margin-left: 10px;
            font-weight: 600;
        }

        .option input[type="radio"] {
            margin-right: 10px;
            cursor: pointer;
        }

        .option label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-submit:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(211, 47, 47, 0.4);
        }

        .btn-submit:active {
            transform: translateY(-2px);
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
            flex: 1;
            max-width: 200px;
        }

        .btn-back:hover {
            background: #e0e0e0;
        }

        .results-screen {
            text-align: center;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.3);
        }

        .results-title {
            font-size: 2em;
            margin: 20px 0;
            color: #333;
        }

        .results-details {
            margin: 30px 0;
            font-size: 1.1em;
            color: #666;
        }

        .results-details p {
            margin: 10px 0;
        }

        .answer-review {
            margin-top: 40px;
            text-align: left;
        }

        .answer-review-title {
            font-size: 1.5em;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .answer-item {
            margin-bottom: 20px;
            padding: 15px;
            border-left: 4px solid #ddd;
            background: #f9f9f9;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .answer-item.correct {
            border-left-color: #4caf50;
            background: #f1f8f4;
        }

        .answer-item.correct:hover {
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.2);
        }

        .answer-item.incorrect {
            border-left-color: #f44336;
            background: #fef1f0;
        }

        .answer-item.incorrect:hover {
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.2);
        }

        .answer-item-question {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .answer-item-info {
            font-size: 0.95em;
            color: #666;
            margin: 5px 0;
        }

        .answer-correct {
            color: #4caf50;
            font-weight: 600;
        }

        .answer-incorrect {
            color: #f44336;
            font-weight: 600;
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--dark-primary) 100%);
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-top: 30px;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(211, 47, 47, 0.4);
        }

        .btn-restart:active {
            transform: translateY(-2px);
        }

        body.bw-mode .settings-section {
            background: #f0f0f0;
            border: 1px solid #ccc;
        }

        body.bw-mode .option {
            border-color: #999;
        }

        body.bw-mode .option:hover {
            border-color: #000;
            background: #f8f8f8;
        }

        body.bw-mode .select-option {
            border-color: #999;
        }

        body.bw-mode .select-option:hover {
            border-color: #000;
        }

        body.bw-mode .select-option.active {
            background: #000;
            color: white;
        }

        body.bw-mode .progress-bar {
            background: #ddd;
        }

        body.bw-mode .progress-fill {
            background: #000;
        }

        body.bw-mode .question-title {
            border-bottom-color: #000;
        }

        /* Мобильная оптимизация */
        @media (max-width: 768px) {
            .container {
                border-radius: 8px;
                margin: 0;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 1.8em;
                margin-bottom: 8px;
            }

            .header p {
                font-size: 0.95em;
            }

            .theme-selector {
                top: 8px;
                right: 8px;
                flex-wrap: wrap;
                gap: 5px;
                max-width: 100%;
            }

            .theme-btn {
                padding: 6px 10px;
                font-size: 0.75em;
            }

            .content {
                padding: 20px 15px;
            }

            .test-selector {
                margin-bottom: 20px;
            }

            .test-selector select,
            .test-selector input {
                padding: 10px;
                font-size: 16px; /* Предотвращает зум на iOS */
            }

            .btn-start {
                padding: 12px;
                font-size: 1em;
            }

            .settings-section {
                padding: 15px;
                margin-bottom: 20px;
            }

            .settings-title {
                font-size: 1.15em;
            }

            .setting-group {
                margin-bottom: 15px;
                padding-bottom: 15px;
            }

            .toggle {
                width: 45px;
                height: 26px;
            }

            .toggle::after {
                width: 22px;
                height: 22px;
            }

            .toggle.active::after {
                left: 21px;
            }

            .question-selector {
                max-height: 200px;
            }

            .question-item {
                padding: 8px;
                font-size: 0.95em;
            }

            .question-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }

            .progress-info {
                flex-direction: column;
                gap: 8px;
                font-size: 0.85em;
                padding: 10px;
            }

            .question-title {
                font-size: 1.1em;
                padding-bottom: 10px;
            }

            .options {
                gap: 10px;
            }

            .option {
                padding: 12px;
            }

            .option label {
                font-size: 0.95em;
            }

            .option input[type="checkbox"] {
                width: 20px;
                height: 20px;
                margin-right: 10px;
                min-width: 20px;
            }

            .btn-group {
                flex-direction: column;
                gap: 8px;
                margin-top: 20px;
            }

            .btn {
                width: 100%;
                max-width: none;
                padding: 12px;
                font-size: 1em;
            }

            .score-circle {
                width: 150px;
                height: 150px;
                font-size: 2.5em;
                margin: 25px auto;
            }

            .results-title {
                font-size: 1.5em;
                margin: 15px 0;
            }

            .results-details {
                font-size: 1em;
            }

            .results-details p {
                margin: 8px 0;
            }

            .answer-review-title {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .answer-item {
                padding: 12px;
                margin-bottom: 12px;
            }

            .answer-item-question {
                font-size: 0.95em;
            }

            .btn-restart {
                padding: 12px 30px;
                font-size: 1em;
                margin-top: 20px;
            }

            .select-group {
                flex-direction: column;
            }

            .select-option {
                width: 100%;
                padding: 10px;
            }

            .toggle-switch {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 20px 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 0.9em;
            }

            .theme-btn {
                padding: 5px 8px;
                font-size: 0.7em;
            }

            .content {
                padding: 15px 10px;
            }

            .settings-title {
                font-size: 1.1em;
            }

            .question-title {
                font-size: 1em;
            }

            .progress-info {
                font-size: 0.8em;
            }

            .progress-item {
                font-size: 0.9em;
            }

            .option {
                padding: 10px;
            }

            .score-circle {
                width: 120px;
                height: 120px;
                font-size: 2em;
            }

            .results-title {
                font-size: 1.3em;
            }

            .answer-item {
                padding: 10px;
            }

            .answer-item-question {
                font-size: 0.9em;
            }
        }

        /* Оптимизация для планшетов */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container {
                max-width: 95%;
            }

            .progress-info {
                font-size: 0.95em;
            }

            .question-title {
                font-size: 1.15em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="theme-selector">
                <button class="theme-btn" onclick="setTheme('red', 'light')">Красная</button>
                <button class="theme-btn" onclick="setTheme('blue', 'light')">Синяя</button>
                <button class="theme-btn" onclick="setTheme('green', 'light')">Зеленая</button>
                <button class="theme-btn active" onclick="setTheme('bw', 'light')">Ч/Б</button>
                <button class="theme-btn" onclick="setTheme('red', 'dark')">Темная</button>
            </div>
            <h1>417 Metrics</h1>
            <p>Система тестирования знаний</p>
        </div>

        <div class="content">
            <!-- Экран выбора теста -->
            <div id="testSelector" class="test-selector">
                <label for="testSelect">Выберите тест:</label>
                <select id="testSelect" onchange="updateTestInfo()">
                    <option value="">-- Выберите тест --</option>
                </select>

                <!-- Settings Section -->
                <div id="settingsSection" class="settings-section hidden">
                    <div class="settings-title">Параметры теста</div>

                    <!-- Количество вопросов -->
                    <div class="setting-group">
                        <label class="setting-label">📊 Выбор вопросов</label>
                        <div class="setting-desc" id="totalQuestionsCount"></div>

                        <!-- Режим выбора -->
                        <div style="margin-bottom: 15px;">
                            <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                                <input type="radio" name="selectMode" value="count" checked onchange="switchMode('count')">
                                <span>По количеству</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                                <input type="radio" name="selectMode" value="range" onchange="switchMode('range')">
                                <span>По диапазону</span>
                            </label>
                        </div>

                        <!-- Режим количества -->
                        <div id="countMode" style="display: block; margin-bottom: 10px;">
                            <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #555;">Сколько вопросов?</label>
                            <input type="number" id="questionCountInput" min="1" max="100" value="5"
                                   style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1em;">
                        </div>

                        <!-- Режим диапазона -->
                        <div id="rangeMode" style="display: none;">
                            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <div style="flex: 1;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #555;">С вопроса:</label>
                                    <input type="number" id="rangeStart" min="1" value="1"
                                           style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1em;">
                                </div>
                                <div style="flex: 1;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #555;">По вопрос:</label>
                                    <input type="number" id="rangeEnd" min="1" value="5"
                                           style="width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 1em;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Перемешивание ответов -->
                    <div class="setting-group">
                        <label class="setting-label">🔀 Параметры ответов</label>
                        <div class="toggle-switch">
                            <div class="toggle" id="shuffleToggle" onclick="toggleShuffle()"></div>
                            <span>Перемешивать ответы</span>
                        </div>
                    </div>


                    <!-- Выбор конкретных вопросов -->
                    <div class="setting-group" id="questionListGroup" style="display: none;">
                        <label class="setting-label">📋 Выберите вопросы</label>
                        <div class="question-selector" id="questionSelector"></div>
                    </div>
                </div>

                <button class="btn-start" onclick="startTest()">Начать тест</button>

        let currentTest = null;
        let testConfig = {
            questionCount: 'all',
            shuffleAnswers: false,
            selectedQuestions: []
        };
        let userAnswers = [];
        let currentQuestionIndex = 0;
        let testQuestions = [];
        let answeredQuestions = new Set();
        let originalQuestionIndices = [];
        let currentTheme = { color: 'red', mode: 'light' };

        function setTheme(color, mode) {
            document.body.className = '';

            if (color === 'blue') {
                document.body.classList.add('blue-mode');
            } else if (color === 'green') {
                document.body.classList.add('green-mode');
            } else if (color === 'bw') {
                document.body.classList.add('bw-mode');
            }

            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
            }

            currentTheme = { color, mode };
            updateThemeButtons(color, mode);

            // Save preference
            localStorage.setItem('theme', JSON.stringify(currentTheme));
        }

        function loadTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                const theme = JSON.parse(saved);
                document.body.className = '';

                if (theme.color === 'blue') {
                    document.body.classList.add('blue-mode');
                } else if (theme.color === 'green') {
                    document.body.classList.add('green-mode');
                } else if (theme.color === 'bw') {
                    document.body.classList.add('bw-mode');
                } else if (theme.color === 'red') {
                    // Default red theme, no extra class needed
                }

                if (theme.mode === 'dark') {
                    document.body.classList.add('dark-mode');
                }

                currentTheme = theme;
                updateThemeButtons(theme.color, theme.mode);
            } else {
                // Default: black and white theme
                document.body.className = 'bw-mode';
                currentTheme = { color: 'bw', mode: 'light' };
                updateThemeButtons('bw', 'light');
            }
        }

        function updateThemeButtons(color, mode) {
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            const buttons = document.querySelectorAll('.theme-btn');
            if (color === 'red' && mode === 'light') buttons[0].classList.add('active');
            else if (color === 'blue') buttons[1].classList.add('active');
            else if (color === 'green') buttons[2].classList.add('active');
            else if (color === 'bw') buttons[3].classList.add('active');
            else if (color === 'red' && mode === 'dark') buttons[4].classList.add('active');
        }

        function initializeApp() {
            loadTheme();

            const select = document.getElementById("testSelect");
            for (let key in testDatabase) {
                const option = document.createElement("option");
                option.value = key;
                option.textContent = testDatabase[key].name;
                select.appendChild(option);
            }
        }

        function updateTestInfo() {
            const testKey = document.getElementById("testSelect").value;
            if (!testKey) {
                document.getElementById("settingsSection").classList.add("hidden");
                return;
            }

            currentTest = testDatabase[testKey];
            document.getElementById("settingsSection").classList.remove("hidden");
            setupSettings();
        }

        function setupSettings() {
            const totalQuestions = currentTest.questions.length;
            document.getElementById("totalQuestionsCount").textContent =
                `Всего вопросов в тесте: ${totalQuestions}`;

            // Инициализация input полей
            const countInput = document.getElementById("questionCountInput");
            const rangeEnd = document.getElementById("rangeEnd");

            countInput.max = totalQuestions;
            rangeEnd.max = totalQuestions;
            rangeEnd.value = Math.min(5, totalQuestions);

            // Инициализация переменных
            testConfig.shuffleAnswers = false;
            testConfig.questionCount = 'all';
            testConfig.selectedQuestions = [];

            document.getElementById("shuffleToggle").classList.remove("active");

            // Список вопросов
            setupQuestionList();
        }

        function switchMode(mode) {
            const countMode = document.getElementById("countMode");
            const rangeMode = document.getElementById("rangeMode");

            if (mode === 'count') {
                countMode.style.display = 'block';
                rangeMode.style.display = 'none';
            } else {
                countMode.style.display = 'none';
                rangeMode.style.display = 'block';
            }
        }

        function setupQuestionList() {
            const selector = document.getElementById("questionSelector");
            selector.innerHTML = '';

            currentTest.questions.forEach((q, idx) => {
                const item = document.createElement("div");
                item.className = "question-item";
                item.innerHTML = `
                    <input type="checkbox" id="q${idx}" checked onchange="updateSelectedQuestions()">
                    <label for="q${idx}">${idx + 1}. ${q.question.substring(0, 50)}...</label>
                `;
                selector.appendChild(item);
                testConfig.selectedQuestions[idx] = true;
            });
        }


        function updateSelectedQuestions() {
            testConfig.selectedQuestions = [];
            document.querySelectorAll(".question-item input[type='checkbox']").forEach((cb, idx) => {
                testConfig.selectedQuestions[idx] = cb.checked;
            });
        }

        function toggleShuffle() {
            testConfig.shuffleAnswers = !testConfig.shuffleAnswers;
            document.getElementById("shuffleToggle").classList.toggle("active");
        }


        function startTest() {
            if (!currentTest) {
                alert("Пожалуйста, выберите тест");
                return;
            }

            // Определяем режим выбора
            const selectMode = document.querySelector("input[name='selectMode']:checked").value;
            let questions = [];

            if (selectMode === 'count') {
                // Режим по количеству
                const count = parseInt(document.getElementById("questionCountInput").value);

                if (isNaN(count) || count < 1) {
                    alert("Введите корректное количество вопросов");
                    return;
                }

                if (count > currentTest.questions.length) {
                    alert(`Вопросов не может быть больше ${currentTest.questions.length}`);
                    return;
                }

                questions = currentTest.questions.slice(0, count);
            } else {
                // Режим по диапазону
                const start = parseInt(document.getElementById("rangeStart").value) - 1;
                const end = parseInt(document.getElementById("rangeEnd").value);

                if (isNaN(start) || isNaN(end) || start < 0 || end > currentTest.questions.length || start >= end) {
                    alert("Введите корректный диапазон вопросов");
                    return;
                }

                questions = currentTest.questions.slice(start, end);
            }

            if (questions.length === 0) {
                alert("Выберите хотя бы один вопрос");
                return;
            }

            testQuestions = questions;
            userAnswers = new Array(testQuestions.length).fill(null).map(() => []);
            currentQuestionIndex = 0;
            answeredQuestions = new Set();

            // Save original indices from full database
            originalQuestionIndices = [];
            const allQuestions = currentTest.questions;
            for (let i = 0; i < testQuestions.length; i++) {
                for (let j = 0; j < allQuestions.length; j++) {
                    if (testQuestions[i] === allQuestions[j]) {
                        originalQuestionIndices.push(j + 1); // +1 for 1-based indexing
                        break;
                    }
                }
            }

            document.getElementById("testSelector").classList.add("hidden");
            document.getElementById("testScreen").classList.remove("hidden");
            document.getElementById("resultsScreen").classList.add("hidden");

            displayQuestion(0);
        }

        function displayQuestion(index) {
            currentQuestionIndex = index;
            const question = testQuestions[index];
            const questionBlock = document.getElementById("questionBlock");

            const progress = ((index + 1) / testQuestions.length) * 100;
            document.getElementById("progressFill").style.width = progress + "%";

            // Подсчитываем текущий процент правильности (включая текущий ответ если он дан)
            let correctCount = 0;
            let answeredCount = 0;
            for (let i = 0; i <= index; i++) {
                if (userAnswers[i] && userAnswers[i].length > 0) {
                    answeredCount++;
                    if (compareAnswers(userAnswers[i] || [], testQuestions[i].correctAnswer)) {
                        correctCount++;
                    }
                }
            }
            const correctPercentage = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

            const catalogNumber = originalQuestionIndices[index] || (index + 1);

            document.getElementById("progressInfo").innerHTML = `
                <span>Вопрос <span class="progress-item">${index + 1}</span> из <span class="progress-item">${testQuestions.length}</span> (каталог: <span class="progress-item">#${catalogNumber}</span>)</span>
                <span>Прогресс: <span class="progress-item">${Math.round(progress)}%</span> | Правильно: <span class="progress-item">${correctPercentage}%</span> (${correctCount}/${answeredCount})</span>
            `;

            // Подготавливаем опции
            let options = [...question.options];
            if (testConfig.shuffleAnswers) {
                options = shuffleArray(options);
            }

            let optionsHTML = '<div class="options">';
            const isAnswered = answeredQuestions.has(index);

            options.forEach((option, i) => {
                const originalIndex = question.options.indexOf(option);
                const isSelected = (userAnswers[index] || []).includes(originalIndex);
                const isCorrect = question.correctAnswer.includes(originalIndex);

                let optionClass = "";
                let badge = "";

                if (isAnswered) {
                    if (isCorrect) {
                        optionClass = " revealed-correct";
                        badge = '<span class="correct-badge">✓</span>';
                    } else if (isSelected && !isCorrect) {
                        optionClass = " revealed-incorrect";
                        badge = '<span class="incorrect-badge">✗</span>';
                    }
                }

                optionsHTML += `
                    <div class="option${optionClass}">
                        <label>
                            <input type="checkbox" name="answer" value="${originalIndex}" ${isSelected ? "checked" : ""} onchange="selectAnswer(${originalIndex})" ${isAnswered ? "disabled" : ""}>
                            ${option}${badge}
                        </label>
                    </div>
                `;
            });
            optionsHTML += '</div>';

            // Добавляем сообщение о результате
            let resultMessage = '';
            if (isAnswered) {
                const isCorrect = compareAnswers(userAnswers[index] || [], question.correctAnswer);
                if (isCorrect) {
                    resultMessage = '<div style="background: #f1f8f4; border: 2px solid #4caf50; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;"><span style="color: #4caf50; font-weight: 600; font-size: 1.1em;">✓ Правильно!</span></div>';
                } else {
                    resultMessage = '<div style="background: #fef1f0; border: 2px solid #f44336; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;"><span style="color: #f44336; font-weight: 600; font-size: 1.1em;">✗ Неправильно</span></div>';
                }
            }

            let buttonHTML = `
                <div style="display: flex; gap: 10px; margin-top: 20px; justify-content: center;">
                    ${index > 0 ? `<button class="btn btn-back" onclick="displayQuestion(${index - 1})">← Предыдущий</button>` : ''}
                    <button class="btn btn-submit" onclick="answerQuestion()">✓ Ответить</button>
                    ${index < testQuestions.length - 1 ? `<button class="btn btn-submit" onclick="displayQuestion(${index + 1})">Следующий →</button>` : `<button class="btn btn-submit" onclick="submitTest()" style="background: linear-gradient(135deg, #2E7D32 0%, #1B5E20 100%);">Завершить тест</button>`}
                </div>
            `;

            questionBlock.innerHTML = `
                <div class="question-title">Вопрос ${index + 1}: ${question.question}</div>
                ${resultMessage}
                ${optionsHTML}
                ${buttonHTML}
            `;
        }

        function selectAnswer(answerIndex) {
            if (!userAnswers[currentQuestionIndex]) {
                userAnswers[currentQuestionIndex] = [];
            }

            const answers = userAnswers[currentQuestionIndex];
            const idx = answers.indexOf(answerIndex);

            if (idx > -1) {
                answers.splice(idx, 1);
            } else {
                answers.push(answerIndex);
            }

            userAnswers[currentQuestionIndex] = answers;
        }

        function answerQuestion() {
            const answers = userAnswers[currentQuestionIndex];
            if (!answers || answers.length === 0) {
                alert("Пожалуйста, выберите хотя бы один ответ");
                return;
            }

            answeredQuestions.add(currentQuestionIndex);
            displayQuestion(currentQuestionIndex);
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function submitTest() {
            // Проверяем что все вопросы отвечены
            for (let i = 0; i < userAnswers.length; i++) {
                if (!userAnswers[i] || userAnswers[i].length === 0) {
                    alert("Пожалуйста, ответьте на все вопросы");
                    return;
                }
            }

            showResults();
        }

        function compareAnswers(userAnswers, correctAnswers) {
            if (userAnswers.length !== correctAnswers.length) return false;
            const sorted1 = [...userAnswers].sort();
            const sorted2 = [...correctAnswers].sort();
            return sorted1.every((val, idx) => val === sorted2[idx]);
        }

        function getGrade(percentage) {
            if (percentage === 100) return { text: "тест выучен и усвоен", emoji: "🏆" };
            if (percentage >= 91) return { text: "тест выучен и усвоен", emoji: "🏆" };
            if (percentage >= 81) return { text: "мощь", emoji: "💪" };
            if (percentage >= 61) return { text: "милота", emoji: "😊" };
            if (percentage >= 60) return { text: "порог пройден", emoji: "✅" };
            if (percentage >= 40) return { text: "чуть чуть", emoji: "😐" };
            if (percentage >= 21) return { text: "тебе надо тренироваться", emoji: "📚" };
            return { text: "х****во братан", emoji: "😬" };
        }

        function showResults() {
            let correct = 0;
            const answers = [];

            testQuestions.forEach((question, index) => {
                const isCorrect = compareAnswers(userAnswers[index] || [], question.correctAnswer);
                if (isCorrect) correct++;

                const userAnswerTexts = (userAnswers[index] || []).map(idx => question.options[idx]);
                const correctAnswerTexts = question.correctAnswer.map(idx => question.options[idx]);

                answers.push({
                    question: question.question,
                    userAnswers: userAnswerTexts,
                    correctAnswers: correctAnswerTexts,
                    isCorrect: isCorrect
                });
            });

            const total = testQuestions.length;
            const incorrect = total - correct;
            const percentage = Math.round((correct / total) * 100);
            const grade = getGrade(percentage);

            document.getElementById("testScreen").classList.add("hidden");
            document.getElementById("resultsScreen").classList.remove("hidden");

            document.getElementById("scoreCircle").textContent = percentage + "%";
            document.getElementById("correctCount").textContent = correct;
            document.getElementById("incorrectCount").textContent = incorrect;
            document.getElementById("totalCount").textContent = total;

            // Add grade message
            const resultsDetails = document.querySelector(".results-details");
            const gradeDiv = document.createElement("div");
            gradeDiv.style.cssText = "margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; border-left: 4px solid var(--primary-color);";
            gradeDiv.innerHTML = `<p style="font-size: 1.2em; margin: 0;"><span style="font-size: 1.5em;">${grade.emoji}</span> <strong>${grade.text}</strong></p>`;
            resultsDetails.appendChild(gradeDiv);

            let reviewHTML = '<div class="answer-review-title">Подробный разбор ответов:</div>';
            answers.forEach((answer, index) => {
                const statusClass = answer.isCorrect ? "correct" : "incorrect";
                const statusIcon = answer.isCorrect ? "✓" : "✗";
                const statusText = answer.isCorrect ? "Правильно" : "Неправильно";

                const userAnswersStr = answer.userAnswers.join(", ");
                const correctAnswersStr = answer.correctAnswers.join(", ");

                reviewHTML += `
                    <div class="answer-item ${statusClass}">
                        <div class="answer-item-question">${index + 1}. ${answer.question}</div>
                        <div class="answer-item-info">
                            <span class="answer-${answer.isCorrect ? 'correct' : 'incorrect'}">${statusIcon} ${statusText}</span><br>
                            Ваши ответы: <strong>${userAnswersStr}</strong><br>
                            Правильные ответы: <span class="answer-correct"><strong>${correctAnswersStr}</strong></span>
                        </div>
                    </div>
                `;
            });

            document.getElementById("answerReview").innerHTML = reviewHTML;
        }

        function goBack() {
            document.getElementById("testSelector").classList.remove("hidden");
            document.getElementById("testScreen").classList.add("hidden");
            document.getElementById("resultsScreen").classList.add("hidden");
            currentTest = null;
            userAnswers = [];
        }

        function restartTest() {
            startTest();
        }

        window.addEventListener("load", initializeApp);
    </script>
</body>
</html>
